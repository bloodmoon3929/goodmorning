[project]
name = "goodmorning-collector"
version = "0.1.0"
description = "굿모닝 수집기: 쇼핑 API(쿠팡 파트너스) · 크롤링(Scrapy + Playwright) → ingest.raw_listing"
requires-python = ">=3.11"
dependencies = [
    "scrapy>=2.11",
    "scrapy-playwright>=0.0.40",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
# 패키지로 설치하지 않고 이 폴더를 그대로 실행한다 (scrapy.cfg가 있는 곳)
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
