# 크롤링 대상 몰 설정 예시. 복사해서 sites.toml로 쓴다 (sites.toml은 저장소에 올리지 않음).
# 넣기 전에 확인할 것
#   1. robots.txt에서 검색 결과 페이지를 막지 않았는지 (Scrapy도 ROBOTSTXT_OBEY로 다시 확인한다)
#   2. 이용약관에 자동 수집 금지 조항이 없는지
#   3. 확인했으면 DB에서 그 몰을 crawl_allowed = true 로 바꾼다
#      UPDATE online.mall SET crawl_allowed = true WHERE name = '몰 이름';
# 선택자 문법: Scrapy CSS 선택자 (::text, ::attr(href))

[[site]]
mall = "공식 온라인몰"
search_url = "https://official.example/search?q={query}"
js = false
item = "li.product"
title = ".name::text"
price = ".price::text"
shipping = ".shipping::text"
image = "img::attr(src)"
link = "a::attr(href)"
sold_out = ".soldout"

# 자바스크립트로 목록을 그리는 몰은 js = true (Playwright로 연다. 처음 한 번: uv run playwright install chromium)
