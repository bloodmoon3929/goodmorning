[project]
name = "goodmorning-asset3d"
version = "0.1.0"
description = "굿즈 360° 촬영 영상 → SAM 3 분할 → SfM 카메라 추정 → 3D 가우시안 스플래팅 → 앱용 회전 그림"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.8.0",
    "torchvision==0.23.0",
    "sam3",
    "gsplat==1.5.3",
    "ninja",
    "kornia==0.9.2",
    "pycolmap==4.2.1",
    "opencv-python-headless",
    "pillow",
    "numpy",
    "plyfile",
    "scipy",
    # sam3가 쓰지만 의존성에 적지 않은 것
    "pycocotools",
    "psutil",
    "einops",
    "setuptools<80",
]

[tool.uv]
# 폴더 그대로 실행 (패키지로 설치하지 않음)
package = false
# sam3는 numpy<2로 적혀 있지만 numpy 2에서 돌려 확인했다
override-dependencies = ["numpy>=2"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
sam3 = { git = "https://github.com/facebookresearch/sam3", rev = "31cb7e624e4fe95301b1be1d4e809111593d2e45" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
line-length = 140
